name: Release

# Push a tag like v0.2.0 to build the installers and attach them to a draft release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # Apple silicon
            args: --mac dmg --arm64
          - os: macos-15-intel    # Intel Macs (the Mac text reader is built for the runner's chip)
            args: --mac dmg --x64
          - os: windows-latest
            args: --win nsis --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Some tests assume Mac/Linux paths; they run on the other builders and in CI.
      - run: npm test
        if: runner.os != 'Windows'
      - run: npm run desktop:prepare
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Not code-signed yet; see README for how friends open an unsigned app.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: installers/*
