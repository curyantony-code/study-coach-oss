name: Release

# Push a tag like v0.2.0 to build the installers and attach them to a draft release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # Apple silicon (M1 and newer)
            args: --mac dmg --arm64 '-c.mac.artifactName=Study-Coach-${version}-Mac-Apple-Silicon.${ext}'
          - os: macos-15-intel    # Intel Macs (the Mac text reader is built for the runner's chip)
            args: --mac dmg --x64 '-c.mac.artifactName=Study-Coach-${version}-Mac-Intel.${ext}'
          - os: windows-latest
            args: --win nsis --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Some tests assume Mac/Linux paths; they run on the other builders and in CI.
      - run: npm test
        if: runner.os != 'Windows'

      # PDF tools travel inside the app, so friends install nothing else.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: tools
          create-args: -c conda-forge poppler tesseract
          init-shell: none
          cache-environment: true
      - name: Bundle Poppler and Tesseract
        run: micromamba run -n tools node scripts/bundle-tools.mjs
      - name: Check the bundled tools run on their own
        run: |
          T="$PWD/vendor/tools"
          if [ "$RUNNER_OS" = "Windows" ]; then BASEPATH="$T/bin:/c/Windows/System32"; else BASEPATH="$T/bin:/usr/bin:/bin"; fi
          for tool in pdftotext pdfinfo pdftoppm pdftohtml pdfimages; do env -i SYSTEMROOT="${SYSTEMROOT:-}" PATH="$BASEPATH" "$tool" -v 2>&1 | head -1; done
          env -i SYSTEMROOT="${SYSTEMROOT:-}" PATH="$BASEPATH" TESSDATA_PREFIX="$T/share/tessdata" tesseract --list-langs 2>&1 | tee langs.txt
          grep -qw eng langs.txt

      - run: npm run desktop:prepare
      - name: Build the installer
        # macOS runners sometimes fail to unmount the new disk image; one retry clears it.
        run: npx electron-builder ${{ matrix.args }} --publish never || (sleep 20 && npx electron-builder ${{ matrix.args }} --publish never)
        env:
          # Not code-signed yet; see README for how friends open an unsigned app.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Start the packaged app and load its pages
        run: |
          # Hide the build folder so nothing can quietly depend on this machine's files.
          mv .next/standalone .next/standalone-hidden
          node scripts/smoke-packaged.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: installers/*
