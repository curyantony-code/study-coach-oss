name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Study Coach version
      placeholder: "0.1.0"
  - type: dropdown
    id: os
    attributes:
      label: Computer
      options: [Mac (Apple silicon), Mac (Intel), Windows, Linux, Docker]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Screenshots help. Please don't attach copyrighted course material or anything personal.
